version: '3.8'

services:
  # Backend API Service
  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    container_name: rag-backend
    ports:
      - "8000:8000"
    volumes:
      - ../base_knowledge:/app/base_knowledge:ro
      - ../data:/data
      - ../logs:/logs
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - CHROMA_PERSIST_DIRECTORY=/data/chroma_db
      - DOCS_DIRECTORY=/app/base_knowledge
      - LOG_DIR=/logs
      - API_V1_PREFIX=/api/v1
    restart: unless-stopped
    depends_on:
      - ollama
    networks:
      - rag-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/api/v1/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Frontend Streamlit Service
  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    container_name: rag-frontend
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://backend:8000/api/v1
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - rag-network

  # Ollama Service
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-server
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped
    networks:
      - rag-network
    # Uncomment if you have GPU support
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  ollama-data:
    driver: local

networks:
  rag-network:
    driver: bridge
